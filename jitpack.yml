# JitPack build configuration.
# Android Gradle Plugin 8.2 / Kotlin 1.9 require JDK 17 — JitPack defaults to an
# older JDK, so pin it here or the build fails before it starts.
jdk:
  - openjdk17

# JitPack publishes the Maven publication declared in build.gradle.kts via
# com.vanniktech.maven.publish, which names the publication `maven` — not
# `release` — so the task is publishToMavenLocal, not
# publishReleasePublicationToMavenLocal (that task doesn't exist and failed
# the JitPack build of the 1.1.0 tag: "Task
# 'publishReleasePublicationToMavenLocal' not found").
# (artifact group is overridden to com.github.VisionLab-de on JitPack).
install:
  - ./gradlew clean publishToMavenLocal -x test
